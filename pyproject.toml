[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosy"
version = "1.0.0"
description = "Rosy - a production-quality, extensible AI Discord bot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rosy" }]
dependencies = [
    "discord.py>=2.3.2,<3.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "apscheduler>=3.10.4,<4.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
rosy = "rosy.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rosy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
