[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosy"
version = "0.1.0"
description = "Rosy — a modular production AI Discord bot platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rosy Team" }]
dependencies = [
    "discord.py>=2.3.2,<3.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
# extras that enable optional capability modules
voice = ["yt-dlp>=2024.8.6", "PyNaCl>=1.5.0"]
web = ["beautifulsoup4>=4.12.0"]
pdf = ["pypdf>=4.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]